<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1000 на костях ONLINE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Контейнер для уведомлений -->
    <div id="toast-container"></div> 

    <!-- Игровое поле, куда JS добавит кубики -->
    <div class="board" id="game-board"></div>

    <!-- Кнопки управления -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;">
        <button class="btn" id="roll-btn" onclick="rollAll()">БРОСИТЬ</button>
    </div>

    <!-- ПОДКЛЮЧАЕМ СТАБИЛЬНЫЕ СКРИПТЫ FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- ОТЛАДЧИК ОШИБОК: если JS упадет, мы увидим причину прямо на экране смартфона -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.bottom = '10px';
            errDiv.style.left = '10px';
            errDiv.style.background = 'red';
            errDiv.style.color = 'white';
            errDiv.style.padding = '10px';
            errDiv.style.fontSize = '12px';
            errDiv.style.zIndex = '9999';
            errDiv.innerText = "Ошибка: " + message + " (Строка: " + lineno + ")";
            document.body.appendChild(errDiv);
            return false;
        };
    </script>

    <!-- Подключаем вашу игровую логику -->
    <!-- Кнопка вызова правил (сверху справа) -->
<button class="help-btn" onclick="toggleHelpModal(true)" title="Правила бочек">?</button>

<!-- Модальное окно правил -->
<div class="modal-overlay" id="help-modal" onclick="closeModalOnOverlay(event)">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Правила бочек 🛢️</div>
      <button class="close-btn" onclick="toggleHelpModal(false)">&times;</button>
    </div>
    <ul class="barrel-list">
      <li class="barrel-item">
        <strong>Первая бочка:</strong><br>
        Интервал <b>200 ➔ 300</b> очков.
      </li>
      <li class="barrel-item">
        <strong>Вторая бочка:</strong><br>
        Интервал <b>600 ➔ 700</b> очков.
      </li>
      <li class="barrel-item" style="border-left-color: #e74c3c;">
        <strong style="color: #e74c3c;">Финальная бочка:</strong><br>
        Интервал <b>880 ➔ 1000</b> очков.<br>
        Дается ровно <b>3 попытки</b>, чтобы набрать 1000+ очков. При неудаче — штраф -100 очков.
      </li>
    </ul>
  </div>
</div>
    <script src="script.js"></script>
</body>
</html>
